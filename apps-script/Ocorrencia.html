<div class="card">
  <div class="card-header">
    <h2>Bem Vindo, <span id="userDisplayName"></span></h2>
    <p class="card-meta">
      Funcao: <span id="userFunction"></span><br>
      Setor: <span id="userZone"></span><br>
      Local: <span id="userLocation"></span>
    </p>
  </div>
  <div class="card-body">
    <h3 style="text-align: center;">Registro de Ocorrência</h3>
    
    <label for="zonaSelect">Setor:</label>
    <select id="zonaSelect">
        <option selected disabled value=''>Selecione o Setor</option>
        <option>SETOR 01</option>
        <option>SETOR 02</option>
        <option>SETOR 03</option>
        <option>GBS</option>
    </select>
    
    <label for="pontoText">Ponto de Referencia:</label>
    <textarea  id="pontoText" rows="1" placeholder="Ao lado dos Arcos."></textarea>
    
    <label for="tipoSelect">Tipo de Ocorrência:</label>
    <select id="tipoSelect">
        <option selected disabled value=''>Selecione o Tipo</option>
        <option>Incêndio</option>
        <option>Acidente Veicular</option>
        <option>APH</option>
        <option>Superlotação</option>
        <option>Afogamento</option>
        <option>Criança Perdida</option>
        <option>Prevenção</option>
        <option>Lesão corporal por arma branca</option>
        <option>Lesão corporal por arma de fogo</option>
        <option>Outro</option>
    </select>

    <label for="gravidadeSelect">Gravidade da Ocorrência:</label>
    <select id="gravidadeSelect">
        <option selected disabled value=''>Selecione</option>
        <option>Baixa</option>
        <option>Moderada</option>
        <option>Grave</option>
        <option>Fatal</option>
    </select>

    <label for="qtdInput">Quantidade de Pessoas Atendidas/Vítmas:</label>
    <input type="number" id="qtdInput" min="0" max="1000" />
    
    <label for=relatoText >Relato</label>
    <textarea id="relatoText" rows="3" placeholder="Escreva seu relato aqui. Não informe nomes, CPF ou outros dados pessoais de vítimas. "></textarea>

    <div id="formStatus" style="margin-top:10px;"></div>
    
    <button style="margin-bottom: 12px;"onclick="submitOcorrencia()">Enviar</button>
    <button class="btn-cancel" onclick="loadPage('Menu')">Cancelar</button>
  </div>
</div>
